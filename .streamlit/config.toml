# Streamlit configuration (spec decision #1, §22.2).
#
# Streamlit phones home by default. On first run it prints:
#
#     Collecting usage statistics. To deactivate, set browser.gatherUsageStats
#     to false.
#
# That is an outbound network call from the process a recruiter uses to review
# candidates, on a system whose first locked decision is "fully on-prem, no
# external API calls, no candidate data leaves the box". The payload is usage
# telemetry rather than candidate data, but the distinction is not one this
# deployment gets to rely on: an air-gapped host should make no outbound
# connections at all, and a proxy log showing traffic from the screener is a
# question nobody wants to answer during an audit.
#
# This file must ship with the repository. Setting it only on one operator's
# machine means the next person to run the UI re-enables it.
[browser]
gatherUsageStats = false

[server]
# Loopback only, matching the API (§15.2). Auth is stubbed, so anything that can
# reach this port can read every candidate in the system.
address = "127.0.0.1"
headless = true
# Resumes are uploaded through the folder scan, not the browser. A small cap
# limits what an accidental drag-and-drop can push into the process.
maxUploadSize = 5

[client]
# A traceback on screen is useless to a recruiter and indistinguishable from a
# bug in the screening itself. `api_client` turns failures into sentences; this
# stops anything it misses from rendering a stack trace over candidate data.
showErrorDetails = "none"
