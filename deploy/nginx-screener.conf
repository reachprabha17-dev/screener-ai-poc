# Reverse proxy for the Screener API + reviewer interface, reachable only over
# VPN — never the public internet.
#
# The app itself binds to 127.0.0.1:8000 (screener-api.service) and trusts
# whatever X-Actor / X-Actor-Roles headers it receives, because auth_mode=stub
# has no verification of its own (screener/api/deps.py). This proxy is what
# makes that safe to expose beyond localhost: it is the only thing listening on
# the VPN-facing interface, it authenticates every request itself, and it
# overwrites X-Actor from the verified login rather than trusting the client.
#
# Fill in before use:
#   <VPN_IP>         the IP this host answers on *inside* the VPN only —
#                     never 0.0.0.0 and never a public/WAN address.
#   <server_name>     hostname HR users will type, e.g. screener.internal
#   ssl_certificate*  an internal-CA or self-signed cert; see deploy notes.
#
# htpasswd file, one line per HR user (individual logins, not one shared
# account — X-Actor becomes the audit-log identity, so a shared login makes
# every action in the audit trail attributable to "hr" instead of a person):
#   sudo apt install apache2-utils   # provides htpasswd
#   sudo htpasswd -c /etc/nginx/screener.htpasswd alice     # -c only the first time
#   sudo htpasswd    /etc/nginx/screener.htpasswd bob
#
# When AD/LDAP integration lands later, replace the `auth_basic*` directives
# below with nginx's ldap_server / auth_ldap module (or an external authing
# proxy) — everything else in this file (the header-stripping, the proxy_pass,
# the VPN-only bind) stays the same.

server {
    listen <VPN_IP>:443 ssl;
    server_name <server_name>;

    ssl_certificate     /etc/nginx/ssl/screener.crt;
    ssl_certificate_key /etc/nginx/ssl/screener.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic           "Screener";
    auth_basic_user_file /etc/nginx/screener.htpasswd;

    location / {
        # Job descriptions are uploaded as PDF/DOCX, and nginx defaults to 1 MB.
        # Without this a 2 MB document — which JD_MAX_FILE_BYTES allows — is
        # refused here with a 413 before the API ever sees it, which no test in
        # the repo can catch because no test runs behind this proxy. Keep it in
        # step with JD_MAX_FILE_BYTES, slightly above it to cover the multipart
        # envelope.
        client_max_body_size 3m;

        # Strip anything the client sent for these first — otherwise a request
        # that arrives with its own X-Actor header would pass it straight
        # through underneath the one we set below, and some proxies keep the
        # first occurrence rather than the last.
        proxy_set_header X-Actor "";
        proxy_set_header X-Actor-Roles "";

        # Now set the real one, from the login nginx just verified.
        proxy_set_header X-Actor $remote_user;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8000;
    }
}

# Plain-HTTP on the same VPN-only IP, redirecting to TLS rather than serving
# basic-auth credentials in cleartext over the wire.
server {
    listen <VPN_IP>:80;
    server_name <server_name>;
    return 301 https://$host$request_uri;
}
